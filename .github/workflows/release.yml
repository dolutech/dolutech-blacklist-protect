name: Build plugin release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build canonical plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/dolutech-blacklist-protect"
          package_path="$RUNNER_TEMP/dolutech-blacklist-protect.zip"

          mkdir -p "$package_root"
          cp -R \
            dolutech-blacklist-protect.php \
            includes \
            languages \
            readme.txt \
            security.txt \
            uninstall.php \
            "$package_root/"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            plugin_version="$(sed -n 's/^ \\* Version: *//p' dolutech-blacklist-protect.php | head -n 1)"
            tag_version="\${GITHUB_REF_NAME#v}"

            if [[ "$plugin_version" != "$tag_version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match plugin version $plugin_version." >&2
              exit 1
            fi
          fi

          (
            cd "$RUNNER_TEMP"
            zip -qr "$package_path" "dolutech-blacklist-protect"
          )

          unzip -Z1 "$package_path" | grep -Fxq 'dolutech-blacklist-protect/'
          unzip -Z1 "$package_path" | grep -Fxq 'dolutech-blacklist-protect/dolutech-blacklist-protect.php'

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolutech-blacklist-protect
          path: \${{ runner.temp }}/dolutech-blacklist-protect.zip
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/dolutech-blacklist-protect.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/dolutech-blacklist-protect.zip" \
              --generate-notes
          fi
